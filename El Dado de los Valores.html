<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Dado de los Valores</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#0b2260;--mute:#4a5b85;--blue:#0f3d91;--gold:#f7b924;--soft:#e3edff;--line:#c9d9f5;--onblue:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--card:#122050;--ink:#eef3ff;--mute:#a9b8e0;--blue:#7fa8ff;--soft:#182a63;--line:#2a3f80;--onblue:#0a1330}}
:root[data-theme="dark"]{--bg:#0a1330;--card:#122050;--ink:#eef3ff;--mute:#a9b8e0;--blue:#7fa8ff;--soft:#182a63;--line:#2a3f80;--onblue:#0a1330}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 18px 48px;text-align:center}
h1{font-family:"Arial Black","Segoe UI",sans-serif;font-size:clamp(2rem,8vw,3.4rem);margin:0;letter-spacing:-.02em;line-height:1.05}
.verse{display:inline-block;background:#fdeeb5;color:#0b2260;border-radius:999px;padding:8px 20px;margin:16px 0 8px;font-weight:700;font-size:.95rem}
.tag{font-size:1.15rem;color:var(--mute);margin:8px 0 0}
.stage{perspective:900px;height:210px;display:flex;align-items:center;justify-content:center;margin:34px 0 18px}
.cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;transform:rotateX(-25deg) rotateY(-30deg);transition:transform 1.6s cubic-bezier(.15,.7,.2,1)}
.face{position:absolute;inset:0;border-radius:18px;background:linear-gradient(145deg,#fff,#dfe8fb);border:2px solid #c3d3f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;backface-visibility:hidden;color:#0b2260;box-shadow:inset 0 -6px 14px rgba(15,61,145,.12)}
.face b{font-size:40px;line-height:1}
.face span{font-size:.66rem;font-weight:700;line-height:1.15}
.f0{transform:rotateY(0) translateZ(60px)}.f1{transform:rotateY(90deg) translateZ(60px)}.f2{transform:rotateY(180deg) translateZ(60px)}
.f3{transform:rotateY(-90deg) translateZ(60px)}.f4{transform:rotateX(90deg) translateZ(60px)}.f5{transform:rotateX(-90deg) translateZ(60px)}
button{font:inherit}
button.roll{font-weight:800;font-size:1.15rem;background:var(--gold);color:#0b2260;border:0;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 5px 0 #c48d0a}
button.roll:active{transform:translateY(3px);box-shadow:0 2px 0 #c48d0a}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:24px 22px;margin:30px 0 0;text-align:left}
.lbl{color:var(--mute);font-size:.95rem;margin:0}
.card h2{margin:2px 0 10px;font-size:1.7rem;display:flex;align-items:center;gap:12px;line-height:1.15}
.card h2 i{font-style:normal;font-size:2.3rem}
.ideas{background:var(--soft);border-radius:16px;padding:12px 16px}
.ideas ul{margin:4px 0 0;padding-left:20px}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical;margin-top:6px}
.save{background:var(--blue);color:var(--onblue);border:0;border-radius:999px;padding:11px 26px;font-weight:800;cursor:pointer;margin-top:10px}
.hist{margin-top:30px;text-align:left}
.hist h3{margin:0 0 10px;font-size:1.1rem}
.hist ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hist li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.hist li .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
.hist li p{margin:4px 0 0;overflow-wrap:anywhere}
.del{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;font-size:.85rem;padding:0}
.empty{color:var(--mute)}
@media (prefers-reduced-motion:reduce){.cube{transition:none}}
</style>
</head>
<body>
<main>
<h1>El Dado de los Valores</h1>
<div class="verse">Transformaos por medio de la renovación de vuestro entendimiento · Romanos 12:2</div>
<p class="tag">La ética no se improvisa, se cultiva.</p>

<div class="stage" aria-hidden="true"><div class="cube" id="cube"></div></div>
<button class="roll" id="roll">Lanzar el dado</button>

<section class="card" id="result" aria-live="polite">
<p class="empty" style="margin:0">Lanza el dado para descubrir el Valor de la Semana.</p>
</section>

<section class="hist">
<h3>Mis acciones</h3>
<ul id="hist"></ul>
<button class="del" id="clear" style="margin-top:10px">Borrar todo</button>
</section>
</main>
<script>
const V=[
{n:"Respeto",e:"🤝",x:["Escucha a un compañero sin interrumpir.","Agradece una idea distinta a la tuya."]},
{n:"Comunicación",e:"💬",x:["Explica algo pendiente con claridad.","Pregunta si el otro entendió lo que dijiste."]},
{n:"Colaboración",e:"👏",x:["Ofrece ayuda en una tarea del equipo.","Comparte lo que sabes con un colega."]},
{n:"Integridad",e:"🔑",x:["Haz lo correcto aunque nadie te vea.","Cumple una promesa que hiciste."]},
{n:"Responsabilidad",e:"🌱",x:["Termina hoy una tarea que dejaste pendiente.","Reconoce un error y busca cómo repararlo."]},
{n:"Principio de la Comunicación",e:"🗣️",x:["Habla con respeto, incluso en desacuerdo.","Piensa antes de responder en un momento tenso."]},
{n:"Comprender a las Personas",e:"👂",x:["Pregunta a alguien cómo está y escucha de verdad.","Ponte en el lugar de quien piensa distinto."]},
{n:"Motivar a las Personas",e:"⭐",x:["Reconoce el esfuerzo de un compañero.","Anima a alguien que está desanimado."]},
{n:"Justicia",e:"⚖️",x:["Trata a todos con igualdad, sin favoritismos.","Da a cada quien lo que le corresponde."]}];
const cube=document.getElementById('cube'),rollB=document.getElementById('roll'),res=document.getElementById('result'),histEl=document.getElementById('hist');
const front=[[0,0],[0,-90],[0,-180],[0,90],[-90,0],[90,0]];
function face(i,v){const f=cube.children[i];f.innerHTML=`<b>${v.e}</b><span>${v.n}</span>`}
for(let i=0;i<6;i++){cube.insertAdjacentHTML('beforeend',`<div class="face f${i}"></div>`);face(i,V[i])}
let turns=0,cur=null,log=[];
try{log=JSON.parse(localStorage.getItem('dado_acciones')||'[]')}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('dado_acciones',JSON.stringify(log))}catch(e){}}
function renderH(){
 histEl.innerHTML=log.length?log.slice().reverse().map(h=>`<li><div class="top"><span>${h.e} ${esc(h.n)}</span><span>${h.d}</span></div>${h.a?`<p>${esc(h.a)}</p>`:'<p class="empty">Sin acción registrada.</p>'}</li>`).join(''):'<li class="empty">Aún no has registrado acciones.</li>';
}
function show(v){
 res.innerHTML=`<p class="lbl">Valor de la Semana</p><h2><i>${v.e}</i>${v.n}</h2>
 <div class="ideas"><p class="lbl">Ideas para practicarlo:</p><ul>${v.x.map(t=>`<li>${t}</li>`).join('')}</ul></div>
 <label class="lbl" for="acc" style="display:block;margin-top:16px">¿Qué acción realizaste?</label>
 <textarea id="acc" placeholder="Escribe aquí lo que hiciste con este valor..."></textarea>
 <button class="save" id="save">Guardar acción</button>`;
 document.getElementById('save').onclick=()=>{
  const a=document.getElementById('acc').value.trim();
  if(!a){document.getElementById('acc').focus();return}
  log.push({n:v.n,e:v.e,a,d:new Date().toLocaleDateString('es-GT',{day:'numeric',month:'short'})});
  log=log.slice(-50);save();renderH();
  res.insertAdjacentHTML('beforeend','<p class="lbl" style="margin-top:10px">✔ Acción guardada.</p>');
  document.getElementById('acc').value='';
 };
}
rollB.onclick=()=>{
 rollB.disabled=true;
 const fi=Math.floor(Math.random()*6),vi=Math.floor(Math.random()*V.length),v=V[vi],[x,y]=front[fi];
 face(fi,v); // la cara que queda al frente muestra el valor obtenido
 turns++;
 cube.style.transform=`rotateX(${x-25+720*turns}deg) rotateY(${y-30+720*turns}deg)`;
 setTimeout(()=>{
  cube.style.transition='none';
  cube.style.transform=`rotateX(${x-25}deg) rotateY(${y-30}deg)`;
  void cube.offsetWidth;cube.style.transition='';
  show(v);
  rollB.disabled=false;rollB.textContent='Lanzar de nuevo';
 },1700);
};
document.getElementById('clear').onclick=()=>{if(log.length&&confirm('¿Borrar todas tus acciones?')){log=[];save();renderH()}};
renderH();
</script>
</body>
</html>
