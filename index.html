<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Dado de los Valores</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#0b2260;--mute:#4a5b85;--blue:#0f3d91;--gold:#f7b924;--soft:#e3edff;--line:#c9d9f5;--onblue:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--card:#122050;--ink:#eef3ff;--mute:#a9b8e0;--blue:#7fa8ff;--soft:#182a63;--line:#2a3f80;--onblue:#0a1330}}
:root[data-theme="dark"]{--bg:#0a1330;--card:#122050;--ink:#eef3ff;--mute:#a9b8e0;--blue:#7fa8ff;--soft:#182a63;--line:#2a3f80;--onblue:#0a1330}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;position:relative;overflow-x:hidden;background:radial-gradient(circle at 50% 0%,var(--soft),var(--bg) 60%);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
.deco{position:absolute;pointer-events:none;z-index:0}
.sw1{top:-60px;left:-90px;width:300px;height:150px;background:linear-gradient(90deg,#0f3d91,#1e63d6);transform:rotate(-24deg);border-radius:0 0 90px 0;opacity:.16}
.sw3{bottom:-40px;right:-80px;width:340px;height:120px;background:linear-gradient(90deg,#1e63d6,#0f3d91);transform:rotate(-16deg);border-radius:60px;opacity:.14}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 48px;text-align:center}
h1{font-family:"Arial Black","Segoe UI",sans-serif;font-size:clamp(2rem,8vw,3.4rem);margin:0;letter-spacing:-.02em;line-height:1.05}
.verse{display:inline-block;background:#fdeeb5;color:#0b2260;border-radius:999px;padding:8px 20px;margin:16px 0 8px;font-weight:700;font-size:.95rem}
.tag{font-size:1.15rem;color:var(--mute);margin:8px 0 0}
.tag mark{background:#fdeeb5;color:#0b2260;border-radius:10px;padding:0 10px;font-weight:800}
button{font:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* progreso */
.prog{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:24px 0 0;text-align:left}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .6s}
.lbl{color:var(--mute);font-size:.92rem;margin:0}
/* selector */
.dices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 0}
.dc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;color:var(--ink);text-align:center;border-top:4px solid var(--c)}
.dc b{display:block;font-size:1.02rem}.dc span{font-size:.8rem;color:var(--mute)}
.dc[aria-pressed="true"]{background:var(--soft);border-color:var(--c)}
.dc:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.6}
.toast{background:#fdeeb5;color:#0b2260;border-radius:14px;padding:10px 16px;margin:14px 0 0;font-weight:700;animation:pop .4s ease-out}
/* dado */
.stage{perspective:900px;height:200px;display:flex;align-items:center;justify-content:center;margin:26px 0 14px;position:relative}
.stage::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(247,185,36,.16),transparent 68%)}
.bob{animation:bob 3s ease-in-out infinite;position:relative;z-index:1}
.bob.rolling{animation:none}
@keyframes bob{50%{transform:translateY(-5px)}}
.cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;transform:rotateX(-25deg) rotateY(-30deg);transition:transform 1.6s cubic-bezier(.15,.7,.2,1)}
.face{position:absolute;inset:0;border-radius:18px;background:linear-gradient(145deg,#fff,#dfe8fb);border:3px solid var(--dc,#c3d3f2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;backface-visibility:hidden;color:#0b2260;box-shadow:inset 0 -6px 14px rgba(15,61,145,.12)}
.face b{font-size:38px;line-height:1}.face span{font-size:.64rem;font-weight:700;line-height:1.15}
.f0{transform:rotateY(0) translateZ(60px)}.f1{transform:rotateY(90deg) translateZ(60px)}.f2{transform:rotateY(180deg) translateZ(60px)}
.f3{transform:rotateY(-90deg) translateZ(60px)}.f4{transform:rotateX(90deg) translateZ(60px)}.f5{transform:rotateX(-90deg) translateZ(60px)}
button.roll{font-weight:800;font-size:1.15rem;background:var(--gold);color:#0b2260;border:0;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 5px 0 #c48d0a}
button.roll:active{transform:translateY(3px);box-shadow:0 2px 0 #c48d0a}
button:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 0}
.chip{opacity:.75;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.chip.on{opacity:1;background:var(--soft);border-color:var(--c)}
.card{background:var(--card);border:2px solid var(--line);border-top:4px solid var(--c,var(--gold));border-radius:26px;padding:24px 22px;margin:26px 0 0;text-align:left;box-shadow:0 8px 22px rgba(15,61,145,.07)}
.card.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0}}
.card h2{margin:2px 0 10px;font-size:1.7rem;display:flex;align-items:center;gap:12px;line-height:1.15}
.card h2 i{font-style:normal;font-size:2.3rem;background:var(--soft);border-radius:18px;padding:6px 10px}
.ideas{background:var(--soft);border-radius:16px;padding:12px 16px}.ideas ul{margin:4px 0 0;padding-left:20px}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical;margin-top:6px}
.save{background:var(--blue);color:var(--onblue);border:0;border-radius:999px;padding:11px 26px;font-weight:800;cursor:pointer;margin-top:10px}
.hist{margin-top:30px;text-align:left}
.hh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hh h3{margin:0;font-size:1.1rem}
select{font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.hist ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hist li{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:16px;padding:12px 14px}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
.hist li p{margin:4px 0 0;overflow-wrap:anywhere}.hist li small{color:var(--mute)}
.del{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;font-size:.85rem;padding:0;margin-top:12px}
.empty{color:var(--mute)}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.foot span{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:8px 20px;font-weight:700;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bob,.toast,.card.pop{animation:none}.cube,.bar i{transition:none}}
</style>
</head>
<body>
<div class="deco sw1"></div><div class="deco sw3"></div>
<main>
<h1>El Dado de los Valores</h1>
<div class="verse">Transformaos por medio de la renovación de vuestro entendimiento · Romanos 12:2</div>
<p class="tag">La ética no se improvisa, <mark>se cultiva</mark></p>

<section class="prog" aria-live="polite">
<p class="lbl" id="ptxt"></p>
<div class="bar"><i id="pbar"></i></div>
</section>
<div class="dices" id="dices"></div>
<div id="toast" aria-live="polite"></div>

<div class="stage" aria-hidden="true"><div class="bob" id="bob"><div class="cube" id="cube"></div></div></div>
<button class="roll" id="roll">Lanzar el dado</button>
<div class="chips" id="chips" aria-hidden="true"></div>

<section class="card" id="result" aria-live="polite">
<p class="empty" style="margin:0">Lanza el dado para descubrir el Valor de la Semana.</p>
</section>

<section class="hist">
<div class="hh"><h3>Mis acciones</h3>
<select id="filter" aria-label="Filtrar por dado"></select></div>
<ul id="hist"></ul>
<button class="del" id="clear">Reiniciar todo</button>
</section>
<div class="foot"><span>Manual Ético · Agosto 2026</span><span>Carlos Calderón</span></div>
</main>
<script>
/* ====== CONFIGURACIÓN: edita aquí los dados, valores y reglas de desbloqueo ======
   Cada valor: [emoji, nombre, idea1, idea2]
   Regla "need": acciones guardadas en la semana. "distinct": valores distintos en la semana (alternativa). */
const DICES=[
{id:"base",name:"Dado Base",icon:"🎲",color:"#1e63d6",need:0,values:[
 ["🤝","Respeto","Escucha a un compañero sin interrumpir.","Agradece una idea distinta a la tuya."],
 ["💬","Comunicación","Explica algo pendiente con claridad.","Pregunta si el otro entendió lo que dijiste."],
 ["👏","Colaboración","Ofrece ayuda en una tarea del equipo.","Comparte lo que sabes con un colega."],
 ["🔑","Integridad","Haz lo correcto aunque nadie te vea.","Cumple una promesa que hiciste."],
 ["🌱","Responsabilidad","Termina hoy una tarea que dejaste pendiente.","Reconoce un error y busca cómo repararlo."],
 ["⚖️","Justicia","Trata a todos con igualdad, sin favoritismos.","Da a cada quien lo que le corresponde."]]},
{id:"car",name:"Dado del Carácter",icon:"🕊️",color:"#0aa5a8",need:3,values:[
 ["🕊️","Principio del perdón","Deja ir un mal momento con un compañero.","Pide perdón si le fallaste a alguien."],
 ["🙏","Confiar en Dios","Toma un tiempo de oración o reflexión.","Entrega en calma lo que no puedes controlar."],
 ["🌾","Humildad","Pide ayuda o consejo a alguien.","Reconoce el mérito de otra persona."],
 ["⏳","Paciencia","Espera tu turno sin apuro ni queja.","Respira antes de responder en un momento tenso."],
 ["💛","Gratitud","Da las gracias a alguien por algo concreto.","Anota tres cosas buenas de tu día."],
 ["🔍","Honestidad","Di la verdad aunque sea incómoda.","Avisa a tiempo si no llegarás a una entrega."]]},
{id:"lid",name:"Dado del Liderazgo",icon:"🧭",color:"#7a3ff0",need:6,values:[
 ["⭐","Motivar a las Personas","Reconoce el esfuerzo de un compañero.","Anima a alguien que está desanimado."],
 ["👂","Comprender a las Personas","Pregunta a alguien cómo está y escucha de verdad.","Ponte en el lugar de quien piensa distinto."],
 ["🗣️","Principio de la Comunicación","Habla con respeto, incluso en desacuerdo.","Piensa antes de hablar cuando hay tensión."],
 ["🤲","Servicio","Haz algo por alguien sin esperar nada a cambio.","Ayuda con una tarea que nadie quiere hacer."],
 ["🧭","Ejemplo","Haz primero lo que le pides al equipo.","Cumple tus horarios y compromisos."],
 ["🔭","Visión","Ayuda a tu equipo a ver el objetivo de la semana.","Piensa en cómo tu trabajo ayuda a otros."]]},
{id:"mae",name:"Dado Maestro",icon:"👑",color:"#c99a00",need:9,distinct:5,mix:["Respeto","Integridad","Confiar en Dios","Servicio","Justicia","Motivar a las Personas"]}
];
const MAESTRO=DICES[3];
MAESTRO.values=MAESTRO.mix.map(n=>DICES.slice(0,3).flatMap(d=>d.values).find(v=>v[1]===n));
/* ================================================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wk(){const d=new Date(),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-'+Math.ceil(((t-y)/864e5+1)/7)}
let S={log:[],unlocked:["base"]};
try{const r=JSON.parse(localStorage.getItem('dado_v2')||'null');if(r&&r.log&&r.unlocked)S=r}catch(e){}
const save=()=>{try{localStorage.setItem('dado_v2',JSON.stringify(S))}catch(e){}};
let cur=DICES[0],turns=0,rolling=false,filt="all",last=null;
const week=()=>S.log.filter(h=>h.w===wk());
const nDist=()=>new Set(week().map(h=>h.n)).size;
/* acciones que faltan para desbloquear un dado */
function faltan(d){const a=week().length;let f=Math.max(0,d.need-a);if(d.distinct)f=Math.min(f,Math.max(0,d.distinct-nDist()));return f}
function checkUnlocks(){const nuevos=[];DICES.forEach(d=>{if(!S.unlocked.includes(d.id)&&faltan(d)===0){S.unlocked.push(d.id);nuevos.push(d)}});return nuevos}
function renderProg(){
 const a=week().length,sig=DICES.find(d=>!S.unlocked.includes(d.id));
 if(!sig){$('ptxt').textContent=`Llevas ${a} acciones esta semana. ¡Tienes todos los dados desbloqueados!`;$('pbar').style.width='100%';return}
 const pct=Math.max(a/sig.need,sig.distinct?nDist()/sig.distinct:0);
 $('ptxt').innerHTML=`<b>${a}</b> acciones esta semana · faltan <b>${faltan(sig)}</b> para desbloquear el ${sig.name}`;
 $('pbar').style.width=Math.min(100,pct*100)+'%';
}
function renderDices(){
 $('dices').innerHTML=DICES.map(d=>{const ok=S.unlocked.includes(d.id);
  const sub=ok?`${d.values.length} valores`:`🔒 ${d.distinct?`${d.need} acciones o ${d.distinct} valores distintos`:d.need+' acciones'}`;
  return `<button class="dc" style="--c:${d.color}" data-id="${d.id}" aria-pressed="${d.id===cur.id}" ${ok?'':'disabled'}><b>${d.icon} ${d.name}</b><span>${sub}</span></button>`}).join('');
 $('filter').innerHTML='<option value="all">Todos los dados</option>'+DICES.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
 $('filter').value=filt;
}
function renderCube(){
 $('cube').innerHTML=cur.values.map((v,i)=>`<div class="face f${i}" style="--dc:${cur.color}"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('');
 $('chips').innerHTML=cur.values.map((v,i)=>`<span class="chip" id="ch${i}" style="--c:${cur.color}">${v[0]} ${v[1]}</span>`).join('');
}
function renderH(){
 const l=S.log.filter(h=>filt==="all"||h.d===filt).slice().reverse();
 $('hist').innerHTML=l.length?l.map(h=>{const d=DICES.find(x=>x.id===h.d)||{};return `<li style="--c:${d.color||'#c9d9f5'}"><div class="top"><span>${h.e} ${esc(h.n)}</span><span>${esc(h.f)}</span></div><small>${d.icon||''} ${esc(d.name||'')}</small><p>${esc(h.a)}</p></li>`}).join(''):'<li class="empty">Aún no hay acciones registradas.</li>';
}
function show(v){
 const c=cur.color;const r=$('result');r.style.setProperty('--c',c);r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');
 r.innerHTML=`<p class="lbl">Valor de la Semana · ${cur.name}</p><h2><i>${v[0]}</i>${v[1]}</h2>
 <div class="ideas"><p class="lbl">Ideas para practicarlo:</p><ul><li>${v[2]}</li><li>${v[3]}</li></ul></div>
 <label class="lbl" for="acc" style="display:block;margin-top:16px">¿Qué acción realizaste?</label>
 <textarea id="acc" placeholder="Escribe aquí lo que hiciste con este valor..."></textarea>
 <button class="save" id="save">Guardar acción</button>`;
 $('save').onclick=()=>{
  const a=$('acc').value.trim();if(!a){$('acc').focus();return}
  S.log.push({d:cur.id,n:v[1],e:v[0],a,f:new Date().toLocaleDateString('es-GT',{day:'numeric',month:'short'}),w:wk()});
  S.log=S.log.slice(-100);
  const nuevos=checkUnlocks();save();
  $('acc').value='';
  $('save').insertAdjacentHTML('afterend','<p class="lbl" style="margin-top:10px">✔ Acción guardada.</p>');$('save').remove();
  if(nuevos.length)$('toast').innerHTML=nuevos.map(d=>`<div class="toast">🎉 Desbloqueaste el ${d.name}</div>`).join('');
  renderProg();renderDices();renderH();
 };
}
$('dices').onclick=e=>{const b=e.target.closest('.dc');if(!b||b.disabled||rolling)return;cur=DICES.find(d=>d.id===b.dataset.id);renderDices();renderCube();$('result').innerHTML='<p class="empty" style="margin:0">Lanza el dado para descubrir el Valor de la Semana.</p>';$('result').style.removeProperty('--c')};
$('filter').onchange=e=>{filt=e.target.value;renderH()};
const front=[[0,0],[0,-90],[0,-180],[0,90],[-90,0],[90,0]];
$('roll').onclick=()=>{
 rolling=true;$('roll').disabled=true;$('bob').classList.add('rolling');$('toast').innerHTML='';
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
 const i=Math.floor(Math.random()*6),[x,y]=front[i],cu=$('cube');
 turns++;cu.style.transform=`rotateX(${x-25+720*turns}deg) rotateY(${y-30+720*turns}deg)`;
 setTimeout(()=>{
  cu.style.transition='none';cu.style.transform=`rotateX(${x-25}deg) rotateY(${y-30}deg)`;void cu.offsetWidth;cu.style.transition='';
  show(cur.values[i]);$('ch'+i).classList.add('on');$('bob').classList.remove('rolling');
  rolling=false;$('roll').disabled=false;$('roll').textContent='Lanzar de nuevo';
 },1700);
};
$('clear').onclick=()=>{if(confirm('¿Reiniciar todo? Se borrarán tus acciones y tus dados desbloqueados.')){S={log:[],unlocked:["base"]};cur=DICES[0];filt="all";save();renderAll();$('toast').innerHTML='';$('result').innerHTML='<p class="empty" style="margin:0">Lanza el dado para descubrir el Valor de la Semana.</p>'}};
function renderAll(){renderProg();renderDices();renderCube();renderH()}
checkUnlocks();save();renderAll();
</script>
</body>
</html>
